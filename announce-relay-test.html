<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reticulum announce relay test</title>
    <style>
      body {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 13px;
        margin: 20px auto;
        max-width: 760px;
        padding: 0 12px;
        background: #14171c;
        color: #eee;
      }
      h1 { font-size: 16px; }
      pre {
        background: #0d1014;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 10px;
        white-space: pre-wrap;
        word-break: break-all;
        user-select: all;
      }
    </style>
  </head>
  <body>
    <h1>Reticulum announce relay test</h1>
    <p>Two reticulum.js peers connect to the same WebSocket entry point and bounce announces.</p>
    <pre id="log">Loading modules…</pre>
    <script type="module">
      const log = (line) => {
        const el = document.getElementById("log");
        el.textContent += line + "\n";
      };

      const toHex = (/** @type {Uint8Array} */ bytes) =>
        [...bytes].map((b) => b.toString(16).padStart(2, "0")).join("");

      try {
        const core = await import("./vendor/reticulum-core.js");
        const { Reticulum, Identity, Destination, DestType, WebSocketClientInterface } = core;
        log("Modules loaded ✓");

        const ENTRY_URL = "wss://cloud.lille-oe.de";
        // Accept the room from the URL query string for testing specific rooms
        const params = new URLSearchParams(location.search);
        const ROOM = params.get("room") ?? "noflo-ui:announce-relay-test";

        // Derive the aspect name exactly like y-reticulum does
        const digest = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(ROOM),
        );
        const aspectHex = toHex(new Uint8Array(digest).slice(0, 8));
        const APP_NAME = `y-reticulum.sync.${aspectHex}`;
        log(`Aspect name: ${APP_NAME}`);

        // --- Peer A ---
        const rnsA = new Reticulum();
        const wsA = new WebSocketClientInterface({ url: ENTRY_URL });
        await wsA.connect();
        rnsA.addInterface(wsA, true);
        log(`Peer A WebSocket online: ${wsA.online}`);

        // --- Peer B ---
        const rnsB = new Reticulum();
        const wsB = new WebSocketClientInterface({ url: ENTRY_URL });
        await wsB.connect();
        rnsB.addInterface(wsB, true);
        log(`Peer B WebSocket online: ${wsB.online}`);

        // --- Identities ---
        const idA = await Identity.generate();
        const idB = await Identity.generate();
        const hashA = toHex(await Identity.truncatedHash(await idA.getPublicKey()));
        const hashB = toHex(await Identity.truncatedHash(await idB.getPublicKey()));
        log(`Peer A identity: ${hashA}`);
        log(`Peer B identity: ${hashB}`);

        // --- Destinations ---
        const destA = await Destination.IN(APP_NAME, DestType.SINGLE, idA, rnsA);
        const destB = await Destination.IN(APP_NAME, DestType.SINGLE, idB, rnsB);
        const destHashA = toHex(destA.destinationHash);
        const destHashB = toHex(destB.destinationHash);
        log(`Peer A destination: ${destHashA}`);
        log(`Peer B destination: ${destHashB}`);

        // --- Announce listeners ---
        let aSawB = false;
        let bSawA = false;
        rnsA.transport.addEventListener("announce", (/** @type {any} */ e) => {
          const dh = e.detail?.destinationHash ? toHex(e.detail.destinationHash) : "?";
          log(`Peer A received announce: ${dh}`);
          if (dh === destHashB) aSawB = true;
        });
        rnsB.transport.addEventListener("announce", (/** @type {any} */ e) => {
          const dh = e.detail?.destinationHash ? toHex(e.detail.destinationHash) : "?";
          log(`Peer B received announce: ${dh}`);
          if (dh === destHashA) bSawA = true;
        });

        // --- Announce from both ---
        log("Announcing from both peers…");
        await destA.announce();
        await destB.announce();
        log("Announces sent. Waiting for cross-reception…");

        // Nudge after 5s
        setTimeout(async () => {
          log("Nudging announces…");
          await destA.announce();
          await destB.announce();
        }, 5000);

        // Report after 15s
        setTimeout(() => {
          log("");
          log("=== RESULTS ===");
          log(`Peer A saw Peer B's announce: ${aSawB ? "YES" : "NO"}`);
          log(`Peer B saw Peer A's announce: ${bSawA ? "YES" : "NO"}`);
          if (aSawB && bSawA) {
            log("Announce relay: WORKING ✓");
          } else {
            log("Announce relay: NOT WORKING ✗");
          }
        }, 15000);
      } catch (err) {
        log(`ERROR: ${err?.message ?? err}`);
        console.error(err);
      }
    </script>
  </body>
</html>
