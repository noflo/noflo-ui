<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowbased Graph Editor</title>
    <link rel="stylesheet" href="./src/main.css" />
  </head>
  <body data-theme="tube" data-age="abstract">
    <div id="start-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000;">
      <div style="background: white; padding: 2rem; border-radius: 8px; text-align: center; color: black;">
        <h2>Flowbased Graph Editor</h2>
        <p>Please select a directory to begin.</p>
        <button id="start-btn" type="button" style="padding: 0.5rem 1rem; cursor: pointer;">Open Directory</button>
      </div>
    </div>
    <div id="controls" style="display: none;">
      <div class="control-group">
        <div class="control-label">Files</div>
      </div>
      <div id="file-list-container" class="control-group" style="display:none;">
        <div id="file-list-container-inner">
          <ul id="file-list"></ul>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="importmap">
      {
        "imports": {
          "fontawesome-icons": "./vendor/fontwesome-icons-7.3.0.js",
          "jedison": "./vendor/jedison-1.13.0.js",
          "noflo": "./vendor/noflo-1.5.2.js"
        }
      }
    </script>
    <script type="module" src="src/edit.js"></script>
  </body>
</html>
