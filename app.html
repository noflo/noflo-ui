<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoFlo UI</title>
    <link rel="stylesheet" href="./src/main.css" />
    <link rel="stylesheet" href="./src/styles/json-form.css" />
    <style>
      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
        background: var(--ui-bg, #eee);
        border-bottom: 1px solid #ccc;
        z-index: 2000;
        /* The bar itself stays click-transparent, but its interactive
           children (buttons) must receive events or they fall through to
           the editor canvas below */
        pointer-events: none;
      }
      #topbar > * {
        pointer-events: auto;
      }
      #role-badge {
        font-weight: bold;
      }
      #banner {
        position: fixed;
        top: 2.6rem;
        left: 0;
        right: 0;
        padding: 0.5rem 1rem;
        background: #fff3cd;
        color: #664d03;
        border-bottom: 1px solid #ffe69c;
        z-index: 2000;
      }
      #app {
        padding-top: 2.6rem;
      }
    </style>
  </head>
  <body data-theme="tube" data-age="abstract">
    <header id="topbar">
      <span id="project-name">Project</span>
      <span id="role-badge">Starting&hellip;</span>
      <button id="mesh-settings" title="Mesh settings">&#9881;</button>
    </header>
    <div id="banner" hidden></div>
    <div id="app"></div>
    <noflo-mesh-settings id="mesh-settings-dialog" hidden></noflo-mesh-settings>
    <script type="importmap">
      {
        "imports": {
          "fontawesome-icons": "./vendor/fontwesome-icons-7.3.0.js",
          "jedison": "./vendor/jedison.js",
          "noflo": "./vendor/noflo.js",
          "yjs": "./vendor/yjs.js"
        }
      }
    </script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
