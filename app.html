<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoFlo UI</title>
    <link rel="stylesheet" href="./src/main.css" />
    <link rel="stylesheet" href="./src/styles/json-form.css" />
    <style>
      #banner {
        position: fixed;
        top: 0.5rem;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(90vw, 640px);
        padding: 0.5rem 1rem;
        background: #fff3cd;
        color: #664d03;
        border: 1px solid #ffe69c;
        border-radius: 6px;
        z-index: 2000;
      }
    </style>
  </head>
  <body data-theme="tube" data-age="abstract">
    <div id="banner" hidden></div>
    <div id="app"></div>
    <noflo-context-chip id="context-chip"></noflo-context-chip>
    <noflo-mesh-settings id="mesh-settings-dialog" hidden></noflo-mesh-settings>
    <noflo-sync-panel id="sync-panel" hidden></noflo-sync-panel>
    <script type="importmap">
      {
        "imports": {
          "fontawesome-icons": "./vendor/fontwesome-icons-7.3.0.js",
          "jedison": "./vendor/jedison.js",
          "yjs": "./vendor/yjs.js"
        }
      }
    </script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
