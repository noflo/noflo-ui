<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoFlo UI</title>
    <link rel="stylesheet" href="./src/main.css" />
  </head>
  <body>
    <div id="controls">
      <script>
        // biome-ignore lint/correctness/noUnusedVariables: Biome doesn't see onclicks
        function setTheme(theme) {
          document.body.setAttribute('data-theme', theme);
        }
        // biome-ignore lint/correctness/noUnusedVariables: Biome doesn't see onclicks
        function setAge(age) {
          document.body.setAttribute('data-age', age);
        }
      </script>
      <div class="control-group">
        <div class="control-label">Theme</div>
        <div class="button-row">
          <button type="button" onclick="setTheme('cyberpunk')">Cyberpunk</button>
          <button type="button" onclick="setTheme('tube')">Tube Map</button>
        </div>
      </div>
      <div class="control-group">
        <div class="control-label">Age</div>
        <div class="button-row">
          <button type="button" class="btn-age btn-abstract" onclick="setAge('abstract')">Abstract</button>
          <button type="button" class="btn-age btn-golden" onclick="setAge('golden')">Golden</button>
          <button type="button" class="btn-age btn-offline" onclick="setAge('offline')">Offline</button>
          <button type="button" class="btn-age btn-crashed" onclick="setAge('crashed')">Crashed</button>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="importmap">
      {
        "imports": {
          "fontawesome-icons": "./vendor/fontwesome-icons-7.3.0.js",
          "jedison": "./vendor/jedison-1.13.0.js",
          "noflo": "./vendor/noflo-1.5.2.js"
        }
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
