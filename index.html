<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      @font-face {
        font-family: SourceCodePro;
        src: url('./vendor/SourceCodePro-Regular.otf.woff2');
      }
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: SourceCodePro, monospace;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #controls {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 8px;
        color: white;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border: 1px solid #444;
      }
      .control-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .control-label {
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        color: #aaa;
      }
      .button-row {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      button {
        cursor: pointer;
        background: #333;
        color: white;
        border: 1px solid #555;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
      }
      button:hover {
        background: #444;
      }
      button:active {
        background: #222;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <script>
        // biome-ignore lint/correctness/noUnusedVariables: Biome doesn't see onclicks
        function setTheme(theme) {
          document.body.setAttribute('data-theme', theme);
        }
        // biome-ignore lint/correctness/noUnusedVariables: Biome doesn't see onclicks
        function setAge(age) {
          document.body.setAttribute('data-age', age);
        }
      </script>
      <div class="control-group">
        <div class="control-label">Theme</div>
        <div class="button-row">
          <button type="button" onclick="setTheme('cyberpunk')">Cyberpunk</button>
          <button type="button" onclick="setTheme('tube')">Tube Map</button>
        </div>
      </div>
      <div class="control-group">
        <div class="control-label">Age</div>
        <div class="button-row">
          <button type="button" onclick="setAge('abstract')">Abstract</button>
          <button type="button" onclick="setAge('golden')">Golden</button>
          <button type="button" onclick="setAge('offline')">Offline</button>
          <button type="button" onclick="setAge('crashed')">Crashed</button>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="importmap">
      {
        "imports": {
          "noflo": "./vendor/NoFlo.js"
        }
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
